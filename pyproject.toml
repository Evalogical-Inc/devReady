[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devready-cli"
version = "1.1.0"
description = "A local-first, read-only CLI that checks a project's environment requirements against what is installed."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Evalogical Inc" }]
keywords = ["developer-tools", "cli", "doctor", "environment", "preflight", "mcp", "claude-code", "codex", "ai-agents", "nvmrc", "onboarding"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4"]

[project.urls]
Homepage = "https://devready-ten.vercel.app/"
Repository = "https://github.com/Evalogical-Inc/devReady"
Issues = "https://github.com/Evalogical-Inc/devReady/issues"

[project.scripts]
devready = "devready.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devready"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/devready/explain.py" = ["E501"]
