[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devready"
version = "0.0.1"
description = "A local-first, read-only CLI that checks a project's environment requirements against what is installed."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4"]

[project.scripts]
devready = "devready.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devready"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
