name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
  npm:
    # Launcher unit tests only; the real uvx/pipx run happens in publish.yml once PyPI has the version.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - run: npm test
        working-directory: npm
  action:
    # Exercises action.yml itself (installs the published devready-cli from PyPI).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Passing project succeeds (junit output)
        uses: ./
        with:
          project: tests/fixtures/action-pass
          only: project
          format: junit
      - name: Failing project fails the job
        id: bad
        uses: ./
        continue-on-error: true
        with:
          project: tests/fixtures/action-fail
          only: project
      - name: Expect the failure above
        shell: bash
        run: test "${{ steps.bad.outcome }}" = "failure"
      - name: Known failure in baseline does not fail the job
        uses: ./
        with:
          project: tests/fixtures/action-fail
          only: project
          baseline: tests/fixtures/action-fail/baseline.json
