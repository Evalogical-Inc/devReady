name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # not preinstalled on GitHub's runners; installed so their real-tool tests run
      - uses: pnpm/action-setup@v6
        with:
          version: "12.15.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
        env:
          DEVREADY_REQUIRE_REAL: pnpm bun  # fail instead of skip if these are missing
  npm:
    # Launcher unit tests only; the real uvx/pipx run happens in publish.yml once PyPI has the version.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - run: npm test
        working-directory: npm
  action:
    # Exercises action.yml itself (installs the published devready-cli from PyPI).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Passing project succeeds (junit output)
        uses: ./
        with:
          project: tests/fixtures/action-pass
          only: project
          format: junit
      - name: Multiple only prefixes include both project and git checks
        uses: ./
        with:
          project: tests/fixtures/action-pass
          only: project git
          format: json
          output: devready-only.json
      - name: Check both only prefixes are present
        shell: bash
        run: |
          python - <<'PYTHON'
          import json
          with open("devready-only.json", encoding="utf-8") as report:
              ids = {r["check_id"] for r in json.load(report)["results"]}
          assert any(i.startswith("project.") for i in ids), ids
          assert any(i.startswith("git.") for i in ids), ids
          assert all(i.startswith(("project.", "git.")) for i in ids), ids
          PYTHON
      - name: Multiple skip ids remove the known failure and git identity
        uses: ./
        with:
          project: tests/fixtures/action-fail
          only: project git
          skip: project.python.requires git.identity
          format: json
          output: devready-skip.json
      - name: Check skipped ids are absent and remaining checks still ran
        shell: bash
        run: |
          python - <<'PYTHON'
          import json
          with open("devready-skip.json", encoding="utf-8") as report:
              results = json.load(report)["results"]
          ids = {r["check_id"] for r in results}
          assert "project.python.requires" not in ids, ids
          assert "git.identity" not in ids, ids
          assert "git.version" in ids, ids
          assert all(r["status"] not in ("fail", "error") for r in results), results
          PYTHON
      - name: Failing project fails the job
        id: bad
        uses: ./
        continue-on-error: true
        with:
          project: tests/fixtures/action-fail
          only: project
      - name: Expect the failure above
        shell: bash
        run: test "${{ steps.bad.outcome }}" = "failure"
      - name: Known failure in baseline does not fail the job
        uses: ./
        with:
          project: tests/fixtures/action-fail
          only: project
          baseline: tests/fixtures/action-fail/baseline.json
      - name: SARIF saved to a file, job still fails
        id: sarif
        uses: ./
        continue-on-error: true
        with:
          project: tests/fixtures/action-fail
          only: project
          format: sarif
          output: devready.sarif
      - name: Expect the failure and a valid SARIF file
        shell: bash
        run: |
          test "${{ steps.sarif.outcome }}" = "failure"
          python -c "import json; assert json.load(open('devready.sarif'))['runs'][0]['results']"
