name: Publish to PyPI
on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # re-run only the MCP Registry step for the current server.json
jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing (no API token stored)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
  npm:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # npm trusted publishing + provenance (no token stored)
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest  # trusted publishing needs npm >= 11.5
      # smoke test: the launcher must run the PyPI release that was just published (pipx ships on the runner);
      # PyPI's CDN can serve the old index for 10+ minutes (v1.3.0 needed a rerun at 10), so retry for up to ~30
      - run: |
          for i in $(seq 30); do node bin/devready.js --version | grep -qx "devready $(node -p "require('./package.json').version")" && exit 0; sleep 60; done; exit 1
        working-directory: npm
      # npm page shows the full project README; relative links point at GitHub
      - run: sed -E 's#\]\(([A-Za-z][^):]*)\)#](https://github.com/Evalogical-Inc/devReady/blob/main/\1)#g' ../README.md > README.md
        working-directory: npm
      - run: npm publish --provenance --access public
        working-directory: npm
  mcp-registry:
    needs: publish
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # registry OIDC login grants io.github.<repo owner>/*
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: curl -sSfL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
  github-release:
    needs: publish
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub Release for the tag
    steps:
      - uses: actions/checkout@v7
      - name: Create the release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && exit 0   # already created (re-run)
          awk -v v="${TAG#v}" '$0 ~ "^## "v" " {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          gh release create "$TAG" --verify-tag --title "${TAG#v}" --notes-file notes.md
