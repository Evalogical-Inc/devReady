name: Publish to PyPI
on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # re-run only the MCP Registry step for the current server.json
jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing (no API token stored)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
  npm:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # npm trusted publishing + provenance (no token stored)
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest  # trusted publishing needs npm >= 11.5
      # smoke test: the launcher must run the PyPI release that was just published (pipx ships on the runner)
      - run: |
          for i in 1 2 3 4 5; do node bin/devready.js --version | grep -qx "devready $(node -p "require('./package.json').version")" && exit 0; sleep 30; done; exit 1
        working-directory: npm
      - run: npm publish --provenance --access public
        working-directory: npm
  mcp-registry:
    needs: publish
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # registry OIDC login grants io.github.<repo owner>/*
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: curl -sSfL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
